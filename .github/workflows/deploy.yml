# Japan Clarity — GitHub Pages production deployment.
# Builds the static export for the reviewed main branch and deploys it with
# GitHub's official Pages actions. No secrets are required or used.
#
# One-time repository setup (Settings → Pages): set "Build and deployment →
# Source" to "GitHub Actions" (not "Deploy from a branch"). See
# docs/DEPLOYMENT.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (locked)
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: ESLint
        run: bun run lint

      - name: Research integrity gate
        run: bun run validate:research

      - name: Static export build (GitHub Pages target)
        run: bun run export:static

      - name: Verify static export artifact
        run: bun run verify:export

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build-export/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
